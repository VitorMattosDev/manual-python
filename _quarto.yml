bibliography: referencias.bib
csl: associacao-brasileira-de-normas-tecnicas.csl

crossref:
  chapters: true

filters:
  - tikz
  - quarto

tikz:
  svg-engine: dvisvgm
  cache: true

format:
  html:
    theme: [cosmo, styles.css]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    link-external-newwindow: true
    fig-align: center
  pdf:
    documentclass: scrbook
    papersize: a4
    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm
    toc-depth: 2
    number-sections: true
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}

execute:
  freeze: auto
  echo: true
  warning: false
